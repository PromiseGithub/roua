name: Docker

# Builds the roua CLI image on every change; on a published release it pushes
# ghcr.io/promisegithub/roua:<version> and :latest with a signed provenance attestation.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/promisegithub/roua
      PUSH: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Tags
        id: tags
        run: |
          v=$(node -p "require('./packages/cli/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tags=$IMAGE:$v,$IMAGE:latest" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: roua:test
      - name: Smoke test
        run: |
          docker run --rm roua:test --version | grep -q "${{ steps.tags.outputs.version }}"
          docker run --rm roua:test --help | grep -q "roua mcp"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | docker run --rm -i roua:test mcp | grep -q generate_account_scripts
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.PUSH == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true
      - if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
