name: Engines

# Runs the generated ROUA scripts against real database engines with their
# official clients, logs in as the account, and proves that reads work while
# writes, DDL, secrets, excluded and later tables are refused, that the audit
# passes, that expiry fires, and that revoke cuts access.
# See scripts/live-engine-test.mjs.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql:
    name: MySQL ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["8.0", "8.4", "9"]
    services:
      db:
        image: mysql:${{ matrix.version }}
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s --health-timeout 5s --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b packages/core
      - run: node scripts/live-engine-test.mjs mysql ${{ job.services.db.id }}

  mariadb:
    name: MariaDB ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["10.6", "10.11", "11.4"]
    services:
      db:
        image: mariadb:${{ matrix.version }}
        env:
          MARIADB_ROOT_PASSWORD: root
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b packages/core
      - run: node scripts/live-engine-test.mjs mariadb ${{ job.services.db.id }}

  sqlserver:
    name: SQL Server 2022
    runs-on: ubuntu-latest
    env:
      MSSQL_SA_PASSWORD: Roua-ci-Passw0rd!
    services:
      db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Roua-ci-Passw0rd!
          MSSQL_AGENT_ENABLED: "true"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Roua-ci-Passw0rd!' -C -Q 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b packages/core
      - run: node scripts/live-engine-test.mjs sqlserver ${{ job.services.db.id }}

  oracle:
    name: Oracle 23ai Free
    runs-on: ubuntu-latest
    env:
      ORACLE_PASSWORD: RouaCi123
    services:
      db:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: RouaCi123
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s --health-timeout 5s --health-retries 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b packages/core
      - run: node scripts/live-engine-test.mjs oracle ${{ job.services.db.id }}

  mongodb:
    name: MongoDB ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["6.0", "7.0", "8.0"]
    services:
      db:
        image: mongo:${{ matrix.version }}
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b packages/core
      - run: node scripts/live-engine-test.mjs mongodb ${{ job.services.db.id }}

  redis:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["redis:7.2", "redis:7.4", "valkey/valkey:8"]
    services:
      db:
        image: ${{ matrix.image }}
        options: >-
          --health-cmd "redis-cli ping || valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b packages/core
      - run: node scripts/live-engine-test.mjs redis ${{ job.services.db.id }}
