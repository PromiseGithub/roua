name: MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io)
# as io.github.PromiseGithub/roua. Run it by hand after the npm release it points to
# has been approved and is live: the registry checks mcpName in that npm package.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - name: Check the npm package is live with the same version
        run: |
          v=$(node -p "require('./server.json').version")
          live=$(npm view @roua-dev/cli@"$v" version 2>/dev/null || true)
          [ "$live" = "$v" ] || { echo "@roua-dev/cli@$v is not live on npm yet (approve the staged release first)"; exit 1; }
          npm view @roua-dev/cli@"$v" mcpName | grep -qx "io.github.PromiseGithub/roua"
      - name: Install mcp-publisher (pinned)
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
